# Top 100 US equities by market cap + the ~100 largest crypto assets.
#
#   titan validate --config configs/top100.yaml
#
# THIS IS A BIG RUN. ~200 instruments is roughly 50x the data of a 4-symbol
# config: budget 1-3 hours, and expect Yahoo to throttle partway through a
# 200-symbol download (rerun; the data_cache makes the second pass cheap).
#
# EXPECT INSTRUMENTS TO BE DROPPED. Quality control is not cosmetic here:
# many crypto assets listed below have under ~4 years of history, thin or
# fabricated volume, or a ticker that was renamed (MATIC->POL, FTM->S), and
# some are not carried by Yahoo at all. Those fail QC and are excluded from
# the run rather than silently degrading it. Read artifacts/quality.json
# afterwards to see exactly who survived and why the rest did not.
#
# Market-cap rankings drift; treat this list as a starting universe, not a
# maintained index.

run:
  seed: 7
  artifacts_dir: artifacts
  log_level: INFO

data:
  provider: yahoo
  cache_dir: data_cache
  bars: 2500
  min_history_bars: 1500
  min_reliability: 0.85

