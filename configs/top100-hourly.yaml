# Top 100 US equities on HOURLY bars, ~3-hour holds (semi-scalping at scale).
#
#   titan validate --config configs/top100-hourly.yaml
#
# THE CRYPTO HALF OF configs/top100.yaml IS DELIBERATELY ABSENT.
# Yahoo's hourly crypto series carries no volume on roughly half its bars
# (measured: 50.7%-51.7% across BTC, ETH, SOL, XRP, DOGE and LINK). TITAN's
# volume features -- OBV slope, dollar-volume z-score, up/down volume, close
# location value -- would be computed on that, so QC refuses every one of
# those symbols and the run cannot start. For hourly crypto, export 1h bars
# from an exchange chart into data_tv/ and use configs/style-semiscalp-crypto
# .yaml, which reads them through the csv provider. Crypto on DAILY bars is
# fine on Yahoo: use configs/top100.yaml.
#
# RUNTIME: ~100 instruments x ~3,500 hourly bars is roughly 350,000 panel
# rows. Budget several hours and expect Yahoo to throttle partway through a
# 100-symbol download -- rerun, the data_cache makes the second pass cheap.
# tuning_iterations is trimmed accordingly; raise it once a shorter universe
# has told you the setup is worth the compute.
#
# HISTORY CEILING: Yahoo keeps 730 calendar days of hourly bars, about 3,500
# bars for a US equity. That satisfies the fold geometry below and is still
# only two years of market. Read regime_breakdown before anything else: a
# walk-forward that never met a bear market has not been tested against one.

run:
  seed: 7
  artifacts_dir: artifacts
  log_level: INFO

data:
  provider: yahoo
  timeframe: 1h
  cache_dir: data_cache
  bars: 3500
  min_history_bars: 3000
  min_reliability: 0.85

universe:
  name: top100-hourly
  benchmark: SPY
  instruments:
