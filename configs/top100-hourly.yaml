labels:
  horizon_bars: 3         # ~3 hours
  tp_sigma: 1.10          # 2.0 * sqrt(3/10): daily reachability at a 3-bar horizon
  sl_sigma: 0.82          # 1.5 * sqrt(3/10)

cv:
  n_folds: 4
  embargo_bars: 10
  min_train_bars: 1400    # ~200 sessions
  test_bars: 400          # ~60 sessions per fold

regime:
  min_train_bars: 400

model:
  members: [hgb, rf, logistic]
  calibration: isotonic
  tuning_iterations: 6    # trimmed: the panel is large, search breadth is expensive
  internal_folds: 3

backtest:
  costs:
    commission_bps: 1.0
    spread_bps: 5.0       # crossed ~6.5x more often than on daily bars
    impact_coefficient: 0.10

risk:
  target_annual_vol: 0.10
  risk_per_trade_pct: 0.3
