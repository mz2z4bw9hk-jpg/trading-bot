# MU, Bitcoin, Solana universe with Yahoo Finance

run:
  seed: 7
  artifacts_dir: artifacts
  log_level: INFO

data:
  provider: yahoo
  cache_dir: data_cache
  bars: 2500
  min_history_bars: 1500

universe:
  name: mu-btc-sol
  benchmark: SPY
  instruments:
    - { symbol: SPY,      asset_class: etf,    sector: broad }
    - { symbol: MU,       asset_class: equity, sector: technology }
    - { symbol: BTC-USD,  asset_class: crypto, sector: crypto }
    - { symbol: SOL-USD,  asset_class: crypto, sector: crypto }

cv:
  n_folds: 5
  embargo_bars: 10
  min_train_bars: 756
  test_bars: 252

backtest:
  costs:
    commission_bps: 1.0
    spread_bps: 3.0
    impact_coefficient: 0.10

risk:
  target_annual_vol: 0.10
