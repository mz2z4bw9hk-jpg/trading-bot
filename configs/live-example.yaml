# Example real-data configuration (requires network egress to Yahoo Finance
# or vendor CSV exports; see docs/VALIDATION.md §4 before trusting results).
#
#   titan validate --config configs/live-example.yaml
#
# Synthetic results DO NOT transfer: re-run the full validation protocol on
# this data before acting on anything the platform produces.

run:
  seed: 7
  artifacts_dir: artifacts
  log_level: INFO

data:
  provider: yahoo          # or "csv" with csv_dir pointing at vendor exports
  cache_dir: data_cache
  bars: 2500               # ~10 years of daily bars
  min_history_bars: 2000
  min_reliability: 0.85    # stricter than the synthetic default

universe:
  name: us-core-plus-crypto
  benchmark: SPY
  instruments:
    - { symbol: AAPL,    asset_class: equity, sector: technology }
    - { symbol: MSFT,    asset_class: equity, sector: technology }
    - { symbol: NVDA,    asset_class: equity, sector: technology }
    - { symbol: JPM,     asset_class: equity, sector: financials }
    - { symbol: GS,      asset_class: equity, sector: financials }
    - { symbol: XOM,     asset_class: equity, sector: energy }
    - { symbol: CVX,     asset_class: equity, sector: energy }
    - { symbol: JNJ,     asset_class: equity, sector: healthcare }
    - { symbol: UNH,     asset_class: equity, sector: healthcare }
    - { symbol: WMT,     asset_class: equity, sector: consumer }
    - { symbol: QQQ,     asset_class: etf,    sector: broad }
    - { symbol: IWM,     asset_class: etf,    sector: broad }
    - { symbol: BTC-USD, asset_class: crypto, sector: crypto }
    - { symbol: ETH-USD, asset_class: crypto, sector: crypto }

# Crypto trades 7 days a week against equities' 5: frames are aligned by
# intersection in cross-sectional features and by each instrument's own
# calendar elsewhere. Mixed-calendar universes are supported but inspect
# quality.json for gap flags before trusting cross-features.

cv:
  scheme: expanding
  n_folds: 6
  embargo_bars: 10
  min_train_bars: 756      # 3 years minimum before the first test window
  test_bars: 252

model:
  members: [hgb, rf, logistic]
  calibration: isotonic
  tuning_iterations: 16

backtest:
  costs:
    commission_bps: 1.0
    spread_bps: 3.0        # be honest about your venue; sweep 2x-4x in §3
    impact_coefficient: 0.10
    borrow_bps_daily: 0.5

risk:
  target_annual_vol: 0.10  # start conservative on real capital
  risk_per_trade_pct: 0.4
