[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan"
version = "0.2.0"
description = "PROJECT TITAN - institutional-grade quantitative research and trading intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TITAN Quant Research" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.104", "uvicorn>=0.24"]
data = ["yfinance>=0.2.40", "pyarrow>=14.0"]
# httpx2 backs starlette's TestClient, which the dashboard API tests use;
# newer starlette requires it by name rather than falling back to httpx.
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "types-PyYAML", "httpx2"]

[project.scripts]
titan = "titan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
titan = ["server/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running integration tests",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary is not always clearer
    "B905",    # zip strict: noisy for numeric code
    "RUF002",  # docstring unicode
    # sklearn-idiomatic naming (X, X_train, R) is clearer than PEP8 here
    "N803",
    "N806",
    "N812",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
